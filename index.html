<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1a" media="(prefers-color-scheme: dark)">
<meta name="description" content="10 full mock exams for the telc Deutsch A2·B1 exam — Lesen, Sprachbausteine, Hören, Schreiben, Sprechen, with real timing, scoring and review.">
<title>telc Deutsch A2·B1 — Mock Exam Trainer</title>
<script>
  /* Apply the saved theme before first paint so there is no light-mode flash. */
  (function () {
    try {
      var t = localStorage.getItem('telcTrainerTheme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      if (t === 'dark') document.documentElement.classList.add('dark');
    } catch (e) {}
  })();
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
