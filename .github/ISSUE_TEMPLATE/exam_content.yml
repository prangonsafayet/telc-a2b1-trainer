name: Exam content correction
description: A wrong, ambiguous or unfair item in one of the ten Modelltests
labels: [content]
body:
  - type: input
    id: exam
    attributes:
      label: Which exam
      placeholder: Modelltest 7
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: Which item
      placeholder: Lesen Teil 2, question 3
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong
      options:
        - The keyed answer is incorrect
        - Two answers are defensible
        - The answer is not derivable from the text
        - German is wrong or unnatural
        - Difficulty is out of place for this test's level
    validations:
      required: true
  - type: textarea
    id: reasoning
    attributes:
      label: Reasoning
      description: Quote the relevant part of the text and explain why the keyed answer does not follow from it.
    validations:
      required: true
