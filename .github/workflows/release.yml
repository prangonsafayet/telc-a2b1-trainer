name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # A tag must not be publishable if the tree does not pass — the release is the
      # promise that this commit works.
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
      - run: npm run build

      - name: Package the built site
        run: tar -czf telc-trainer-${{ github.ref_name }}.tar.gz -C dist .

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: telc-trainer-${{ github.ref_name }}.tar.gz
