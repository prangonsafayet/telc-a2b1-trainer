# Cuts a release: verifies main, bumps the version, tags it, publishes notes.
# Manually dispatched, because choosing patch/minor/major is a judgement call — this
# project does not use conventional commits, so it cannot be inferred.
#
# It does not deploy. Netlify deploys every push to main, including the release commit.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      dry-run:
        description: 'Verify and print the next version without pushing'
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Verify, bump and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # A tag is a promise that this commit works, so the full suite runs here even
      # though CI already ran it on the merge. This is the one deliberate overlap.
      - name: Verify
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run validate
          npm run test:unit

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install browser system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e -- --project=chromium

      - name: Build
        run: npm run build

      - name: Bump the version
        id: bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # --no-git-tag-version so the commit message and tag are ours to control.
          npm version "${{ inputs.bump }}" --no-git-tag-version
          VERSION="v$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Next version: $VERSION"

      - name: Stop here on a dry run
        if: inputs.dry-run
        run: |
          echo "Dry run — would release ${{ steps.bump.outputs.version }}"
          git diff --stat

      - name: Commit, tag and push
        if: ${{ !inputs.dry-run }}
        run: |
          git add package.json package-lock.json
          git commit -m "Release ${{ steps.bump.outputs.version }}"
          git tag -a "${{ steps.bump.outputs.version }}" -m "${{ steps.bump.outputs.version }}"
          git push origin main --follow-tags

      - name: Package the built site
        if: ${{ !inputs.dry-run }}
        run: tar -czf "telc-trainer-${{ steps.bump.outputs.version }}.tar.gz" -C dist .

      - name: Publish the GitHub release
        if: ${{ !inputs.dry-run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.version }}
          name: ${{ steps.bump.outputs.version }}
          generate_release_notes: true
          files: telc-trainer-${{ steps.bump.outputs.version }}.tar.gz
