# Verification only. Runs on every pull request and on every push to main.
# It never deploys and never releases — Netlify deploys, release.yml versions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run test:unit

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # The official image ships the browsers and every OS library they need. Installing
    # them on a bare runner means `playwright install --with-deps` shelling out to apt for
    # ~20 MB of fonts and libs, which is slow and has hung the job outright.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The image's browsers only match one Playwright version. If the dependency is
      # bumped without bumping the image tag, fail here rather than in a confusing way.
      - name: Check the image matches the Playwright version
        run: |
          WANT=$(node -p "require('@playwright/test/package.json').version")
          if [ "$WANT" != "1.62.1" ]; then
            echo "::error::Playwright is $WANT but the container image is pinned to 1.62.1."
            echo "Update the image tag in .github/workflows/ci.yml and release.yml."
            exit 1
          fi
          echo "Playwright $WANT matches the image."

      - run: npm run test:e2e -- --project=chromium

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Deliberately no secrets: this is what a fork or a first-time contributor gets,
      # and it catches anything that silently depends on a local .env.
      - run: npm run build
